<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secrets Of The Journey Sessions</title>
    <script>document.documentElement.setAttribute("data-theme", localStorage.getItem("theme") || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));</script>
    <script>try{var p=localStorage.getItem("palette");if(p==="blue"||p==="pink")document.documentElement.setAttribute("data-palette",p)}catch(e){}</script>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="sound.css">
    <link rel="stylesheet" href="palette.css">
    <link rel="stylesheet" href="tasks.css">
</head>
<body>
<div id="loader" class="loader">
    <img class="loader-logo" src="logo.jpg" alt="">
    <div class="loader-title">The Secrets of the Journey</div>
    <div class="loader-bar"><span></span></div>
    <div class="loader-text">Loading...</div>
</div>
<header class="topbar">
    <div class="brand">
        <img class="logo-sm" src="logo.jpg" alt="">
        <span class="brand-name">Secrets Of The Journey</span>
    </div>
    <div class="top-actions">
        <select id="langSelect" aria-label="Language">
            <option value="ar">العربية</option>
            <option value="en">English</option>
            <option value="ckb">کوردی</option>
        </select>
        <div class="pal-wrap">
            <button id="paletteBtn" class="pal-btn" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="4.5" width="17" height="15" rx="4"/><circle cx="9" cy="9.8" r="1.7" fill="currentColor" stroke="none"/><path d="M4.2 17.6l4.7-4.9a1.3 1.3 0 0 1 1.9 0l2.4 2.6 2-2.5a1.3 1.3 0 0 1 2 0l3.2 4.1" fill="currentColor" fill-opacity=".28"/></svg>
            </button>
            <span id="palTip" class="pal-tip" aria-live="polite"></span>
            <span id="palFx" class="pal-fx" aria-hidden="true"></span>
        </div>
        <label class="theme-toggle" title="Theme">
            <input type="checkbox" id="themeToggle">
            <span class="tt-track">
                <span class="tt-stars"></span>
                <span class="tt-clouds"></span>
            </span>
            <span class="tt-knob"></span>
        </label>
    </div>
</header>

<!-- شاشة تسجيل الدخول -->
<main id="loginView" class="login-page">
    <section class="login-card">
        <img class="logo" src="logo.jpg" alt="">
        <h1 data-i18n="welcome"></h1>
        <p class="subtitle" data-i18n="subtitle"></p>
        <button id="telegramLogin" class="telegram-button">
            <span class="telegram-icon">➤</span>
            <span data-i18n="continue"></span>
        </button>
        <p class="login-note" data-i18n="loginNote"></p>
    </section>
</main>

<!-- الموقع بعد الدخول -->
<main id="appView" class="app" hidden>

    <section id="liveView">
        <div class="card me-card">
            <div id="meAvatarBox"></div>
            <div>
                <div class="muted" data-i18n="hello"></div>
                <div id="meName" class="me-name"></div>
            </div>
        </div>
        <div class="card status-card">
            <button id="soundBell" class="sound-bell" type="button" aria-haspopup="dialog">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/><line class="bell-slash" x1="3" y1="3" x2="21" y2="21"/></svg>
                <span class="bell-dot"></span>
            </button>
            <div id="statusLabel" class="status-label"></div>
            <div id="countdown" class="countdown">--:--:--</div>
            <div id="catScene" class="cat-scene"></div>
            <button id="joinBtn" class="primary" data-i18n="join"></button>
            <div id="joinedInfo" class="muted"></div>
        </div>
        <div class="card">
            <div class="card-head">
                <h3 data-i18n="top5"></h3>
                <div id="clock" class="clock">--:--:--</div>
            </div>
            <ul id="top5" class="rank-list"></ul>
            <div id="top5Empty" class="muted empty" hidden data-i18n="top5Empty"></div>
        </div>
    </section>

    <section id="rankView" hidden>
        <div class="card">
            <h3 data-i18n="rankTitle"></h3>
            <ul id="rankList" class="rank-list"></ul>
        </div>
    </section>

    <section id="tasksView" hidden>
        <div id="tasksRoot"></div>
    </section>

    <section id="accountView" hidden>
        <div class="card">
            <div class="acc-head">
                <div id="accAvatarBox"></div>
                <div id="accName" class="me-name"></div>
                <div id="accUser" class="muted"></div>
            </div>
            <div class="stat"><span data-i18n="statHours"></span><b id="accHours">-</b></div>
            <div class="stat"><span data-i18n="statRank"></span><b id="accRank">-</b></div>
            <div class="stat"><span data-i18n="statSessions"></span><b id="accSessions">-</b></div>
        </div>
        <div class="card">
            <div class="card-head">
                <h3 data-i18n="progressTitle"></h3>
                <div class="seg">
                    <button id="progWeek" class="seg-btn active" data-i18n="periodWeek"></button>
                    <button id="progMonth" class="seg-btn" data-i18n="periodMonth"></button>
                </div>
            </div>
            <div id="progTotal" class="muted"></div>
            <div id="progChart" class="prog-chart"></div>
        </div>
        <button id="logoutBtn" class="logout-btn" data-i18n="logout"></button>
    </section>
</main>

<!-- الشريط السفلي -->
<nav id="tabbar" class="tabbar" hidden>
    <button class="tab-item active" data-view="live">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg>
        <span data-i18n="navLive"></span>
    </button>
    <button class="tab-item" data-view="rank">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
        <span data-i18n="navRank"></span>
    </button>
    <a id="adminLink" href="admin.html" class="tab-item" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/></svg>
        <span data-i18n="navAdmin"></span>
    </a>
    <button class="tab-item" data-view="tasks">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6h11M9 12h11M9 18h11"/><path d="M3.5 6l1.5 1.5L7.5 5M3.5 12l1.5 1.5L7.5 11M3.5 18l1.5 1.5L7.5 17"/></svg>
        <span id="tabTasksLabel">مهامي</span>
    </button>
    <button class="tab-item" data-view="account">
        <span id="tabAvatarBox" class="tab-avatar"></span>
        <span data-i18n="navAccount"></span>
    </button>
</nav>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="cat.js"></script>
<script src="sound.js"></script>
<script src="palette.js"></script>
<script src="tasks.js"></script>
<script src="script.js"></script>
</body>
</html>
