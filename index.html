<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secrets Of The Journey Sessions</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header class="topbar">
    <div class="brand">
        <img class="logo-sm" src="logo.jpg" alt="">
        <span class="brand-name">Secrets Of The Journey</span>
    </div>
    <div class="top-actions">
        <select id="langSelect" aria-label="Language">
            <option value="ar">العربية</option>
            <option value="en">English</option>
            <option value="ckb">کوردی</option>
        </select>
        <label class="theme-toggle" title="Theme">
            <input type="checkbox" id="themeToggle">
            <span class="tt-track">
                <span class="tt-stars"></span>
                <span class="tt-clouds"></span>
            </span>
            <span class="tt-knob"></span>
        </label>
    </div>
</header>

<!-- شاشة تسجيل الدخول -->
<main id="loginView" class="login-page">
    <section class="login-card">
        <img class="logo" src="logo.jpg" alt="">
        <h1 data-i18n="welcome"></h1>
        <p class="subtitle" data-i18n="subtitle"></p>
        <button id="telegramLogin" class="telegram-button">
            <span class="telegram-icon">➤</span>
            <span data-i18n="continue"></span>
        </button>
        <p class="login-note" data-i18n="loginNote"></p>
    </section>
</main>

<!-- الموقع بعد الدخول -->
<main id="appView" class="app" hidden>

    <section id="liveView">
        <div class="card me-card">
            <div id="meAvatarBox"></div>
            <div>
                <div class="muted" data-i18n="hello"></div>
                <div id="meName" class="me-name"></div>
            </div>
        </div>
        <div class="card status-card">
            <div id="statusLabel" class="status-label"></div>
            <div id="countdown" class="countdown">--:--:--</div>
            <button id="joinBtn" class="primary" data-i18n="join"></button>
            <div id="joinedInfo" class="muted"></div>
        </div>
        <div class="card">
            <div class="card-head">
                <h3 data-i18n="top5"></h3>
                <div id="clock" class="clock">--:--:--</div>
            </div>
            <ul id="top5" class="rank-list"></ul>
            <div id="top5Empty" class="muted empty" hidden data-i18n="top5Empty"></div>
        </div>
    </section>

    <section id="rankView" hidden>
        <div class="card">
            <h3 data-i18n="rankTitle"></h3>
            <ul id="rankList" class="rank-list"></ul>
        </div>
    </section>

    <section id="accountView" hidden>
        <div class="card">
            <div class="acc-head">
                <div id="accAvatarBox"></div>
                <div id="accName" class="me-name"></div>
                <div id="accUser" class="muted"></div>
            </div>
            <div class="stat"><span data-i18n="statHours"></span><b id="accHours">-</b></div>
            <div class="stat"><span data-i18n="statRank"></span><b id="accRank">-</b></div>
            <div class="stat"><span data-i18n="statSessions"></span><b id="accSessions">-</b></div>
        </div>
                    <div class="stat"><span data-i18n="statSessions"></span><b id="accSessions">-</b></div>
        </div>
        <div class="card">
            <div class="card-head">
                <h3 data-i18n="progressTitle"></h3>
                <div class="seg">
                    <button id="progWeek" class="seg-btn active" data-i18n="periodWeek"></button>
                    <button id="progMonth" class="seg-btn" data-i18n="periodMonth"></button>
                </div>
            </div>
            <div id="progTotal" class="muted"></div>
            <div id="progChart" class="prog-chart"></div>
        </div>
                <div class="stat"><span data-i18n="statSessions"></span><b id="accSessions">-</b></div>
        </div>
        <div class="card">
            <div class="card-head">
                <h3 data-i18n="progressTitle"></h3>
                <div class="seg">
                    <button id="progWeek" class="seg-btn active" data-i18n="periodWeek"></button>
                    <button id="progMonth" class="seg-btn" data-i18n="periodMonth"></button>
                </div>
            </div>
            <div id="progTotal" class="muted"></div>
            <div id="progChart" class="prog-chart"></div>
        </div>
                <div class="stat"><span data-i18n="statSessions"></span><b id="accSessions">-</b></div>
        </div>
        <div class="card">
            <div class="card-head">
                <h3 data-i18n="progressTitle"></h3>
                <div class="seg">
                    <button id="progWeek" class="seg-btn active" data-i18n="periodWeek"></button>
                    <button id="progMonth" class="seg-btn" data-i18n="periodMonth"></button>
                </div>
            </div>
            <div id="progTotal" class="muted"></div>
            <div id="progChart" class="prog-chart"></div>
        </div>
         <div class="stat"><span data-i18n="statSessions"></span><b id="accSessions">-</b></div>
        </div>
        <div class="card">
            <div class="card-head">
                <h3 data-i18n="progressTitle"></h3>
                <div class="seg">
                    <button id="progWeek" class="seg-btn active" data-i18n="periodWeek"></button>
                    <button id="progMonth" class="seg-btn" data-i18n="periodMonth"></button>
                </div>
            </div>
            <div id="progTotal" class="muted"></div>
            <div id="progChart" class="prog-chart"></div>
        </div>
        <div class="stat"><span data-i18n="statSessions"></span><b id="accSessions">-</b></div>
    </div>
    <div class="card"> 
        <div class="card-head"> 
             <h3 data-i18n="progressTitle"></h3>
              <div class="seg">
                    <button id="progWeek" class="seg-btn active" data-i18n="periodWeek"></button>
                    <button id="progMonth" class="seg-btn" data-i18n="periodMonth"></button>
              </div>
              </div>
            <div id="progTotal" class="muted"></div>
            <div id="progChart" class="prog-chart"></div>
        </div>
    </div>
     <div id="progTotal" class="muted"></div>
     <div id="progChart" class="prog-chart"></div>
 </div>
 <button id="logoutBtn" class="logout-btn" data-i18n="logout"></button>
    </section>
</main>

<!-- الشريط السفلي -->
<nav id="tabbar" class="tabbar" hidden>
    <button class="tab-item active" data-view="live">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.5-5 3.5z"/></svg>
        <span data-i18n="navLive"></span>
    </button>
    <button class="tab-item" data-view="rank">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4z"/><path d="M17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3"/></svg>
        <span data-i18n="navRank"></span>
    </button>
    <a id="adminLink" href="admin.html" class="tab-item" hidden>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l8 3v6c0 4.5-3.2 8-8 9-4.8-1-8-4.5-8-9V6z"/></svg>
        <span data-i18n="navAdmin"></span>
    </a>
    <button class="tab-item" data-view="account">
        <span id="tabAvatarBox" class="tab-avatar"></span>
        <span data-i18n="navAccount"></span>
    </button>
</nav>
    <div class="drawer-head">
        <div id="drawerAvatarBox"></div>
        <div id="drawerName" class="me-name"></div>
    </div>
    <button class="drawer-item active" data-view="live" data-i18n="navLive"></button>
    <button class="drawer-item" data-view="rank" data-i18n="navRank"></button>
    <button class="drawer-item" data-view="account" data-i18n="navAccount"></button>
    <a id="adminLink" href="admin.html" class="drawer-item" hidden data-i18n="navAdmin"></a>
    <button id="logoutBtn" class="drawer-item danger" data-i18n="logout"></button>
</aside>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase.js"></script>
<script src="script.js"></script>
</body>
</html>
